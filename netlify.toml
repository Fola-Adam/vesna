[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Supabase project URL and publishable key are intentionally public.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
  # This file contains scanner configuration, not credentials. The scanner
  # otherwise detects its own SECRETS_SCAN_OMIT_KEYS value in this file.
  SECRETS_SCAN_OMIT_PATHS = "netlify.toml"

[[plugins]]
  package = "@netlify/plugin-nextjs"
