<!-- Universal Navbar Component - Include in all pages -->
<header
  class="fixed top-0 w-full z-50 bg-neutral-950/80 backdrop-blur-sm border-b border-neutral-900 transition-all duration-300"
  aria-label="Main Navigation"
>
  <div
    class="flex justify-between items-center px-5 sm:px-8 lg:px-20 h-20 lg:h-24 max-w-[1440px] mx-auto"
  >
    <!-- Logo -->
    <a
      href="{{root}}index.html"
      class="font-audiowide text-3xl lg:text-4xl text-on-background tracking-[0.3em] focus-ring"
      >VESN<span class="lambda-exo2">Λ</span></a
    >

    <!-- Desktop Nav -->
    <nav class="hidden lg:flex gap-8 xl:gap-12 items-center" id="desktop-nav">
      <a
        class="font-button-label uppercase tracking-[0.15em] text-[11px] text-on-surface-variant hover:text-on-background transition-colors nav-underline-anim"
        href="{{root}}index.html"
        data-nav="home"
        >Home</a
      >
      <a
        class="font-button-label uppercase tracking-[0.15em] text-[11px] text-on-surface-variant hover:text-on-background transition-colors nav-underline-anim"
        href="{{root}}pages/picks.html"
        data-nav="picks"
        >Picks</a
      >
      <a
        class="font-button-label uppercase tracking-[0.15em] text-[11px] text-on-surface-variant hover:text-on-background transition-colors nav-underline-anim"
        href="{{root}}pages/archive.html"
        data-nav="archive"
        >Archive</a
      >
      <a
        class="font-button-label uppercase tracking-[0.15em] text-[11px] text-on-surface-variant hover:text-on-background transition-colors nav-underline-anim"
        href="{{root}}pages/journal.html"
        data-nav="journal"
        >Journal</a
      >
      <a
        class="font-button-label uppercase tracking-[0.15em] text-[11px] text-on-surface-variant hover:text-on-background transition-colors nav-underline-anim"
        href="{{root}}pages/about.html"
        data-nav="about"
        >About</a
      >
      <a
        href="#"
        class="text-primary hover:text-on-background transition-colors"
        aria-label="Shopping bag"
      >
        <span class="material-symbols-outlined text-xl">shopping_bag</span>
      </a>
    </nav>

    <!-- Mobile Menu Button -->
    <button
      id="mobile-menu-btn"
      class="lg:hidden flex items-center text-on-background"
      aria-label="Toggle mobile menu"
      aria-expanded="false"
    >
      <span class="material-symbols-outlined text-2xl">menu</span>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div
    id="mobile-menu"
    class="hidden lg:hidden bg-surface-container border-t border-neutral-900"
  >
    <div class="flex flex-col px-5 py-6 gap-4" id="mobile-nav">
      <a
        class="font-button-label uppercase tracking-[0.15em] text-sm text-on-surface-variant py-2 border-b border-neutral-800"
        href="{{root}}index.html"
        data-nav="home"
        >Home</a
      >
      <a
        class="font-button-label uppercase tracking-[0.15em] text-sm text-on-surface-variant py-2 border-b border-neutral-800"
        href="{{root}}pages/picks.html"
        data-nav="picks"
        >Picks</a
      >
      <a
        class="font-button-label uppercase tracking-[0.15em] text-sm text-on-surface-variant py-2 border-b border-neutral-800"
        href="{{root}}pages/archive.html"
        data-nav="archive"
        >Archive</a
      >
      <a
        class="font-button-label uppercase tracking-[0.15em] text-sm text-on-surface-variant py-2 border-b border-neutral-800"
        href="{{root}}pages/journal.html"
        data-nav="journal"
        >Journal</a
      >
      <a
        class="font-button-label uppercase tracking-[0.15em] text-sm text-on-surface-variant py-2 border-b border-neutral-800"
        href="{{root}}pages/about.html"
        data-nav="about"
        >About</a
      >
    </div>
  </div>
</header>
